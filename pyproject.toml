[build-system]
requires = ["setuptools>=64", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "flextensor"
dynamic = ["version"]
description = "FlexTensor: Tensor offloading and management library"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["tensor", "offloading", "machine learning", "pytorch", "memory management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "beartype~=0.21",
    "numpy>=1.20.0",
    "psutil>=5.9.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    # Pytorch 2.5+ required for torch.Event
    "torch>=2.5",
    "scipy>=1.9.0",
    "proxytypes3>=1.0.1",
    "posix-ipc~=1.3.0",
    "shared-memory-dict~=0.7.2",
]

[dependency-groups]
test = [
    "mutmut>=3.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "mypy>=1.10",
    "requests~=2.32",
    "tomli>=2.0; python_version < '3.11'",
    "types-PyYAML>=6.0",
    "types-psutil>=5.9",
    "scipy-stubs>=1.4",
    "types-tqdm>=4.66",
]
docs = [
    "mkdocs~=1.6",
    "mkdocs-material~=9.7",
    "mike~=2.1",
    "mkdocstrings[python]>=0.27",
]
dev = [
    { include-group = "test" },
    "build",
    "pre-commit",
]
all = [
    { include-group = "test" },
    { include-group = "dev" },
    { include-group = "docs" },
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.setuptools.package-data]
flextensor = ["py.typed"]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Packages with no stubs available; silenced until stubs become available.
[[tool.mypy.overrides]]
module = [
    "beartype", "beartype.claw",
    "cupy", "cupy.cuda", "cupy.cuda.runtime",
    "posix_ipc",
    "proxytypes3",
    "safetensors", "safetensors.torch",
    "shared_memory_dict",
    "vllm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu_vram_24g: Test requires exact 24GB GPU VRAM runner",
    "gpu_vram_40g: Test requires exact 40GB GPU VRAM runner",
    "gpu_vram_48g: Test requires exact 48GB GPU VRAM runner",
    "gpu_vram_80g: Test requires exact 80GB GPU VRAM runner",
    "gpu_vram_96g: Test requires exact 96GB GPU VRAM runner",
    "gpu_vram_min_24g: Test requires at least 24GB GPU VRAM",
    "gpu_vram_min_40g: Test requires at least 40GB GPU VRAM",
    "gpu_vram_min_48g: Test requires at least 48GB GPU VRAM",
    "gpu_vram_min_80g: Test requires at least 80GB GPU VRAM",
    "gpu_vram_min_96g: Test requires at least 96GB GPU VRAM",
    "gpu_sm_80: Test requires exact sm_80 runner",
    "gpu_sm_89: Test requires exact sm_89 runner",
    "gpu_sm_90: Test requires exact sm_90 runner",
    "gpu_sm_120: Test requires exact sm_120 runner",
    "gpu_sm_min_80: Test requires at least sm_80",
    "gpu_sm_min_89: Test requires at least sm_89",
    "gpu_sm_min_90: Test requires at least sm_90",
    "gpu_sm_min_120: Test requires at least sm_120",
]
filterwarnings = [
    # Fail on beartype decorator warnings - these indicate type hint issues
    "error::beartype.roar.BeartypeClawDecorWarning",
]

[tool.coverage.run]
source = ["flextensor"]
omit = ["tests/integration/*"]

[tool.coverage.report]
fail_under = 60

[tool.mutmut]
# Line-level coverage filtering is omitted because its in-process cleanup cannot
# safely reload FlexTensor's beartype.claw and PyTorch imports.
source_paths = ["src"]
only_mutate = [
    "src/flextensor/strategy/*",
    "src/flextensor/gpu_budget.py",
    "src/flextensor/memory_block_planner.py",
]
pytest_add_cli_args_test_selection = [
    "tests/unit/test_strategy.py",
    "tests/unit/test_strategy_utils.py",
    "tests/unit/test_adaptive_strategy.py",
    "tests/unit/test_global_offload_strategy.py",
    "tests/unit/test_global_tensor_selection_strategy.py",
    "tests/unit/test_memory_block_planner.py",
    "tests/unit/test_resolve_gpu_budget.py",
    "tests/unit/test_unmapped_gpu_budget.py",
    "tests/unit/test_resolve_gpu_mem_bytes.py",
]

[tool.uv]
managed = true
# uv pip install gained --group support in 0.6.7; Makefile and downstream CI use it for dependency groups.
required-version = ">=0.6.7"

[tool.importlinter]
root_package = "flextensor"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "vLLM is an adapter"
type = "protected"
protected_modules = ["flextensor.contrib.vllm"]
allowed_importers = ["flextensor.contrib.vllm"]

[[tool.importlinter.contracts]]
name = "Package facade is external"
type = "protected"
protected_modules = ["flextensor"]
allowed_importers = ["flextensor.contrib.**"]
as_packages = false

[[tool.importlinter.contracts]]
name = "Strategy is execution-independent"
type = "forbidden"
source_modules = ["flextensor.strategy"]
forbidden_modules = [
    "flextensor.offload_manager",
    "flextensor.tensor_manager",
    "flextensor.loaders",
    "flextensor.tensor_processors",
    "flextensor.trap_tensor_mode",
    "flextensor.state_handler",
    "flextensor.profile_block_controller",
    "flextensor.shm",
]

[[tool.importlinter.contracts]]
name = "Instrumentation is observation-only"
type = "forbidden"
source_modules = ["flextensor.instrumentation"]
forbidden_modules = [
    "flextensor.offload_manager",
    "flextensor.tensor_manager",
    "flextensor.loaders",
    "flextensor.tensor_processors",
    "flextensor.trap_tensor_mode",
    "flextensor.state_handler",
    "flextensor.profile_block_controller",
    "flextensor.shm",
]

[tool.ruff]
preview = true
target-version = "py310"
line-length = 120
indent-width = 4


[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C",   # flake8-comprehensions
    "C4",  # flake8-comprehensions
    "C90", # mccabe
    "CPY", # flake8-copyright
    "E",   # pycodestyle errors
    "ERA", # eradicate
    "F",   # pyflakes
    "G",   # flake8-logging-format
    "I",   # isort
    "N",   # pep8-naming
    "NPY", # NumPy-specific rules
    "PD",  # pandas-vet
    "PGH", # pygrep-hooks
    "PIE", # flake8-pie
    "PTH", # flake8-use-pathlib
    "RSE", # flake8-raise
    "RUF", # Ruff-specific rules
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "SLF", # flake8-self
    "T10", # flake8-debugger
    "T20", # flake8-print
    "TCH", # flake8-type-checking
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

ignore = []
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Ignore unused imports in __init__.py files that are used for exporting the public API
"examples/**/*.py" = ["T201"]  # runnable examples print progress/results to stdout by design
# Vendored benchmark driver. Committed as it was run so the published numbers correspond to this
# exact file; reformatting it would mean the artifact in the repository is no longer the artifact
# that was measured. It monkey-patches LTX internals by design (SLF001), imports after distributed
# init because rank/device must be set first (E402), and mirrors upstream's naming (N8xx).
"examples/ltx23/outpaint/benchmarks/integrated_e2e.py" = [
    "RUF052", "SLF001", "E402", "E501", "N802", "N803", "N805", "N806", "N812", "N814",
    "S110", "PTH103", "PTH207", "SIM105", "SIM108", "C408", "C901", "UP031", "ERA001",
    "RUF012", "RUF046",
]
"tests/**/*.py" = [
    "BLE001",  # broad Exception allowed for transient OS/IPC failures
    "RUF100",  # do not remove "unused" noqa (e.g. BLE001) so intent comments stay
    "S101",    # assertion security warning
    "SLF001",  # private member access
    "T201",    # print statements
]
